<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload</title>
</head>
<body>
  <h1>Upload File</h1>
  <form id="fileUploadForm" enctype="multipart/form-data">
    <input type="file" id="fileInput" name="file" />
    <button type="submit">Upload</button>
  </form>

  <p id="uploadStatus"></p>

  <h3>Uploaded Files:</h3>
  <ul id="uploadedFilesList"></ul>

  <script>
    document.getElementById("fileUploadForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];

      if (!file) {
        alert("Please select a file to upload.");
        return;
      }

      document.getElementById("uploadStatus").innerText = "Uploading file...";

      const formData = new FormData();
      formData.append("file", file);

      fetch("/upload", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          document.getElementById("uploadStatus").innerText = "File uploaded successfully!";
          loadUploadedFiles(); // ✅ Update the list after upload
        } else {
          document.getElementById("uploadStatus").innerText = "File upload failed!";
        }
      })
      .catch(error => {
        document.getElementById("uploadStatus").innerText = "Error uploading file!";
        console.error(error);
      });
    });

    // ✅ Function to load uploaded files from backend
    function loadUploadedFiles() {
      fetch('/files')
        .then(response => response.json())
        .then(data => {
          const list = document.getElementById('uploadedFilesList');
          list.innerHTML = ''; // Clear list
          if (data.success) {
            data.files.forEach(file => {
              const li = document.createElement('li');
              const link = document.createElement('a');
              link.href = file.url;
              link.download = file.name;  // This line makes the file download directly
              link.textContent = file.name;
              li.appendChild(link);
              list.appendChild(li);
            });
          } else {
            list.innerHTML = '<li>Error loading files</li>';
          }
        })
        .catch(err => {
          console.error('Error fetching files:', err);
          document.getElementById('uploadedFilesList').innerHTML = '<li>Failed to fetch files</li>';
        });
    }

    // ✅ Load uploaded files on page load
    window.onload = loadUploadedFiles;
  </script>
</body>
</html>
